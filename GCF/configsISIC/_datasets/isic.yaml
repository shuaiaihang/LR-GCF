dataset:
  name: isic
  kwargs:
    root_dir: /home/wushuai/zhangDS/ISIC2018_prepared/
    labeled_num: 259
    labeled_bs: 4
    batch_size: 8
    batch_size_val: 16
    num_workers: 0
    train_transforms:
      # Pre-transform stage (matching UCMT)
      - name: RandomRotation180
        kwargs: { p: 0.5 }
      - name: RandomHorizontalFlip
        kwargs: { p: 0.5 }
      - name: RandomVerticalFlip
        kwargs: { p: 0.5 }
      # Convert to tensor
      - name: ToTensor
      # Resize to target size
      - name: Resize
        kwargs: { size: [ 256, 256 ] }
      # Normalize
      - name: Normalize
        kwargs: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
    val_transforms:
      - name: ToTensor
      - name: Resize
        kwargs: { size: [ 256, 256 ] }
      - name: Normalize
        kwargs: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }
