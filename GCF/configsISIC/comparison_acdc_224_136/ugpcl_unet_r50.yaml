name: ugpcl_unet_r50

include:
  - ../_datasets/acdc_224.yaml
  - ../_models/unet_tf_r50.yaml
  - ../_trainers/ugpcl.yaml

dataset:
  name: isic
  kwargs:
    labeled_bs: 4
    batch_size: 8
    train_transforms:
      # Pre-transform stage: random flips and rotations (matching UCMT)
      - name: RandomHorizontalFlip
        kwargs: { p: 0.5 }
      - name: RandomVerticalFlip
        kwargs: { p: 0.5 }
      - name: RandomRotation180
        kwargs: { p: 0.5 }
      # Convert to tensor
      - name: ToTensor
      # Resize to target size (before augmentations for efficiency)
      - name: Resize
        kwargs: { size: [ 256, 256 ] }
      # Strong augmentations on tensors (matching UCMT)
      - name: ColorJitter
        kwargs: { brightness: 0.5, contrast: 0.5, saturation: 0.5, hue: 0.25, p: 0.8 }
      - name: GaussianBlur
        kwargs: { kernel_size: 3, sigma: [0.1, 2.0], p: 0.5 }
      # Normalize (must be last)
      - name: Normalize
        kwargs: { mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225] }

train:
  name: UGPCLTrainer
  kwargs:
    contrast_weight: 0.1
    labeled_bs: 4
    consistency: 0.5
    consistency_rampup: 100.0  # max_iter // 100
    memory: true
    max_samples: 1024
    max_views: 1
    memory_size: 500
    pixel_update_freq: 10
    pixel_classes: 4
    max_iter: 10000

model:
  name: UNetTF
  kwargs:
    contrast_embed: True

scheduler:
  name: PolyLR
  kwargs:
    max_iters: 10000
