dataset:
  name: acdc
  kwargs:
    root_dir: data/ACDC
    labeled_num: 7
    labeled_bs: 4
    batch_size: 8
    batch_size_val: 16
    num_workers: 0
    train_transforms:
      - name: RandomGenerator
        kwargs: { output_size: [ 256,256], p_flip: 0.5, p_rot: 0.5 }
      - name: ToRGB
      - name: RandomCrop
        kwargs: { size: [  256,256] }
      - name: RandomFlip
        kwargs: { p: 0 }
      - name: ColorJitter
        kwargs: { brightness: 0.4,contrast: 0.4, saturation: 0.4, hue: 0.1, p: 0 }
    val_transforms:
      - name: RandomGenerator
        kwargs: { output_size: [ 256,256 ], p_flip: 0, p_rot: 0}
      - name: ToRGB
