dataset:
  name: acdc
  kwargs:
    root_dir: data/ACDC
    labeled_num: 7
    labeled_bs: 4
    batch_size: 8
    batch_size_val: 16
    num_workers: 0
    train_transforms:
    - name: RandomGenerator
      kwargs:
        output_size: [256, 256]
        p_flip: 0.5
        p_rot: 0.5
    - {name: ToRGB}
    - name: RandomCrop
      kwargs:
        size: [256, 256]
    - name: RandomFlip
      kwargs: {p: 0}
    - name: ColorJitter
      kwargs: {brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.1, p: 0.5}
    val_transforms:
    - name: RandomGenerator
      kwargs:
        output_size: [256, 256]
        p_flip: 0
        p_rot: 0
    - {name: ToRGB}
model:
  name: UNetTF
  kwargs: {in_channels: 3, classes: 4, encoder_name: resnet50, encoder_weights: imagenet,
    contrast_embed: true, contrast_embed_dim: 256, contrast_embed_index: -3}
train:
  name: GCFTrainer
  kwargs:
    criterions:
    - name: DiceLoss_
      kwargs:
        weight: 0.5
        n_classes: 4
        class_weight: [0.0, 1.0, 1.0, 1.0]
    - name: CrossEntropyLoss_
      kwargs: {weight: 0.5}
    metrics:
    - name: Dice
      kwargs:
        name: Dice
        class_indexs: [0, 1, 2, 3]
        class_names: [bg, c1, c2, c3]
    - name: Jaccard
      kwargs:
        name: Jaccard
        class_indexs: [0, 1, 2, 3]
        class_names: [bg, c1, c2, c3]
    labeled_bs: 4
    consistency: 0.5
    consistency_rampup: 100.0
    max_iter: 10000
    eval_interval: 200
    save_ckpt_interval: 1000
optimizer:
  name: SGD
  kwargs: {lr: 0.01, weight_decay: 0.0005, momentum: 0.9}
scheduler:
  name: PolyLR
  kwargs: {max_iters: 10000, power: 0.9, last_epoch: -1, min_lr: 0.0001}
logger: {log_file: true, tensorboard: true}
name: gcf_unet_r50
config: configs/comparison_acdc_224_136/gcf_unet_r50.yaml
work_dir: model
resume_from: null
start_step: 0
device: cuda:5
data_parallel: false
seed: 1337
deterministic: true
ckpt_save_path: model/gcf_unet_r50_0516105738
